<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League Dashboard | FPL</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="brand">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#00ff87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10z"></path>
                    <path d="M2 12h20"></path>
                </svg>
                <div class="header-titles">
                    <span class="season-tag">2026/2027 SEASON</span>
                    <h1 id="league-name">Loading Dashboard...</h1>
                </div>
            </div>
            <div class="update-status">
                <span class="pulse-dot"></span> <span id="last-updated-text">Live Standings</span>
            </div>
        </div>
    </header>

    <main class="dashboard">
        <!-- Global FPL Top Players Widget -->
        <section class="top-players-widget" id="top-players-container" style="display: none;">
            <!-- Injected via JS -->
        </section>

        <!-- Top 3 Podium -->
        <section class="podium-section" id="podium-container" style="display: none;">
            <!-- Injected via JS -->
        </section>

        <!-- Points Race Chart -->
        <section class="chart-section" id="chart-section">
            <div class="table-card" style="padding: 1.5rem;">
                <div class="table-header" style="border: none; padding: 0 0 1rem 0;">
                    <h2>The Points Race</h2>
                </div>
                <div id="chart-container" style="position: relative; height: 300px; width: 100%;">
                    <canvas id="pointsChart"></canvas>
                </div>
            </div>
        </section>

        <!-- Full League Table -->
        <section class="table-section">
            <div class="table-card">
                <div class="table-header">
                    <h2>League Standings</h2>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Pos</th>
                                <th class="team-col">Manager & Team</th>
                                <th class="center-col">Form (Last 3)</th>
                                <th class="center-col">GW Pts</th>
                                <th class="center-col">Total Pts</th>
                                <th class="center-col">Gap</th>
                                <th class="center-col">To 1st</th>
                            </tr>
                        </thead>
                        <tbody id="league-table-body">
                            <!-- Injected via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>

</html>
